name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Planted-git cases on Windows
        shell: bash
        run: |
          deno task bundle
          deno test --allow-read --allow-write --allow-run --allow-env tests/infrastructure/untrusted_git_test.ts

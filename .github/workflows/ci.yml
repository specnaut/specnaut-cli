name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Stated, not inherited: the repository default is read-only today, and the
# claude-plugins job runs code fetched from npm.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format check
        run: deno task fmt:check
      - name: Lint
        run: deno task lint
      - name: Bundle templates
        run: deno task bundle
      - name: Verify bundle is in sync with templates/
        # deno task bundle (above) regenerates src/templates_bundle.ts.
        # If the committed copy was stale, the regeneration leaves a
        # diff — fail the build so the drift can't land on main. CI
        # otherwise silently masks this: it always re-bundles before
        # testing, so a stale committed bundle never trips a test.
        run: |
          if ! git diff --quiet -- src/templates_bundle.ts; then
            echo "::error::src/templates_bundle.ts is stale — it does not match templates/."
            echo "Run 'deno task bundle' locally and commit the regenerated src/templates_bundle.ts."
            echo "If this keeps happening, install the pre-commit hook: deno task setup"
            git diff --stat -- src/templates_bundle.ts
            exit 1
          fi
          echo "Bundle is in sync with templates/."
      - name: Type check
        run: deno task check
      - name: History records are what their release published
        # Each .specnaut/release/history/v<X>.md is compared with HIGHLIGHTS.md at tag v<X>
        # (cli#775). The checkout is shallow and fetches no tag, so the tags come first, each at
        # depth 1: only the tagged tree is read.
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          deno run --allow-read --allow-run scripts/check-release-history.ts
      - name: Test
        run: deno task test

  # Claude Code's own validator over what this repository publishes to it:
  # the marketplace catalog and the plugin it lists. Shape tests in
  # tests/plugin/ check what we can state; this checks what Claude Code
  # accepts, which is the thing that failed silently for every release
  # until #633 — a catalog that installed nothing. Pinned, so a validator
  # change surfaces as a deliberate bump, not as a red main.
  claude-plugins:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE: "@anthropic-ai/claude-code@2.1.290"
    steps:
      - uses: actions/checkout@v6
        with:
          # Nothing here pushes, and the npm package should not find a token
          # in .git/config.
          persist-credentials: false
      - name: Validate the marketplace catalog
        run: npx --yes "$CLAUDE_CODE" plugin validate packaging/marketplace
      - name: Validate the plugin
        run: npx --yes "$CLAUDE_CODE" plugin validate plugin
      # The cockpit mod: the engine's own reading of its manifest, contract and
      # hooks module, then its wiring tests in the engine's test host. Its
      # logic is covered by deno test (tests/cockpit/) in lint-test.
      - name: Validate the cockpit mod
        run: npx --yes "$CLAUDE_CODE" plugin validate mods/specnaut-cockpit
      - name: Test the cockpit mod
        run: npx --yes "$CLAUDE_CODE" plugin test mods/specnaut-cockpit

  cross-smoke:
    needs: lint-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Bundle + test on ${{ matrix.os }}
        shell: bash
        run: |
          deno task bundle
          deno task test

  # The black-box parity harness (parity/, cli#661) and the Go port (cli#662).
  # The harness builds nothing itself: it runs a TypeScript binary built here
  # (so the parity and mutation tests execute instead of reporting SKIP), that
  # binary against itself (FR-009), and the Go binary against it. Which
  # scenarios the Go pair compares is parity/excluded.go's PortedToGo — no
  # -run filter here. Not a release gate.
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Unit tests (no binary — the parity tests skip here, by design)
        run: go test ./...
      - name: The Go goldens are what the TypeScript side answers today
        # internal/testdata/golden.ts (and golden_commands.ts) run parser.ts, parseLock and
        # assertSafeDestination; a stale golden would judge the port against
        # an answer TypeScript no longer gives.
        run: |
          deno run --allow-read --allow-write internal/testdata/golden.ts
          deno run --allow-read --allow-write internal/testdata/golden_commands.ts
          if [ -n "$(git status --porcelain -- internal/cli/testdata internal/lockfile/testdata internal/upgrade/testdata)" ]; then
            echo "::error::the Go goldens are stale; run internal/testdata/golden.ts and internal/testdata/golden_commands.ts and commit them"
            git status --short -- internal/cli/testdata internal/lockfile/testdata internal/upgrade/testdata
            git diff --stat -- internal/cli/testdata internal/lockfile/testdata internal/upgrade/testdata
            exit 1
          fi
      - name: Build the linux-x64 TypeScript binary under test
        run: |
          deno task bundle
          deno run --allow-read --allow-write --allow-run scripts/build.ts x86_64-unknown-linux-gnu
      - name: Build the Go binary (cgo off)
        run: CGO_ENABLED=0 go build -trimpath -o dist/specnaut-go ./cmd/specnaut
      - name: Parity harness and mutation tests against the TypeScript binary
        env:
          SPECNAUT_BIN: ${{ github.workspace }}/dist/specnaut-linux-x64
        # Explicit bash gets -o pipefail, so `| tee` cannot hide a failure.
        shell: bash
        run: |
          go test -count=1 -v ./parity/... | tee parity.log
          # A green job whose parity tests all skipped would prove nothing.
          if grep -E -- '^--- SKIP: (TestParity|TestMutationsAreCaught|TestMatrixMatchesHelp) ' parity.log; then
            echo "::error::a parity test skipped although SPECNAUT_BIN is set"
            exit 1
          fi
      - name: Diff mode, TypeScript against itself (FR-009) and Go against TypeScript
        shell: bash
        run: |
          ts="$GITHUB_WORKSPACE/dist/specnaut-linux-x64"
          for b in "$ts" "$GITHUB_WORKSPACE/dist/specnaut-go"; do
            SPECNAUT_BIN="$ts" SPECNAUT_BIN_B="$b" go test -count=1 -v -run '^TestParity$' ./parity/ | tee diff.log
            if grep -E -- '^--- SKIP: TestParity ' diff.log; then
              echo "::error::TestParity skipped in diff mode against $b"
              exit 1
            fi
          done

  # The live sandbox suites on Linux: the container backend (an image pinned by digest in
  # .github/sandbox-live/Dockerfile, pulled here since a run never pulls) and bubblewrap inside a
  # systemd user scope. cross-smoke runs the same files on a stock runner, where these skip;
  # macos-latest covers seatbelt. A green job whose container or bwrap tests all skipped would
  # prove nothing, so a skip fails it.
  sandbox-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Pull the pinned live image into every engine
        shell: bash
        run: |
          from=$(sed -n 's/^FROM //p' .github/sandbox-live/Dockerfile)
          ref="${from%%:*}@${from##*@}"
          if ! [[ "$ref" =~ ^[a-z0-9][a-z0-9._/:-]*@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::.github/sandbox-live/Dockerfile does not pin an image by digest: $from"
            exit 1
          fi
          for engine in docker podman; do
            command -v "$engine" >/dev/null || continue
            for try in 1 2 3; do
              "$engine" pull --quiet "$ref" && break
              [ "$try" = 3 ] && { echo "::error::$engine could not pull $ref"; exit 1; }
              sleep 10
            done
          done
          echo "SPECNAUT_LIVE_IMAGE=$ref" >> "$GITHUB_ENV"
      - name: The image holds every tool the probe calls
        run: |
          docker run --rm --pull never --network none --user 65534:65534 "$SPECNAUT_LIVE_IMAGE" \
            /bin/sh -c 'for p in /bin/sh /bin/cat /bin/ls /bin/mkdir /bin/ln /usr/bin/env \
              /usr/bin/grep /usr/bin/sort /usr/bin/tr /usr/bin/head /usr/bin/perl; do
                [ -x "$p" ] || { echo "missing $p"; exit 1; }; done
              /usr/bin/perl -MIO::Socket::INET -MIO::Socket::UNIX -MPOSIX -e 1'
      - name: bubblewrap, and catatonit for podman's --init
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap catatonit
          bwrap --version
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bubblewrap needs
          # one. The VM is single-use and the job already holds root, so lifting it grants nothing new.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: A systemd user manager, for bubblewrap's capped scope
        run: |
          uid=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
      - name: The host offers the container and bubblewrap, bubblewrap in a scope
        run: |
          deno eval --ext=ts '
            import { probed, STATUSES } from "./tests/infrastructure/sandbox_live_fixture.ts";
            console.log(JSON.stringify(STATUSES, null, 1));
            const off = STATUSES.filter((s) => s.kind !== "seatbelt" && !("offered" in s));
            if (off.length > 0) {
              console.log(`::error::not offered here: ${JSON.stringify(off)}`);
              Deno.exit(1);
            }
            if (!probed.bwrapScope) {
              console.log("::error::bubblewrap has no systemd user scope with pids, memory, cpu");
              Deno.exit(1);
            }'
      - name: The live sandbox suites
        shell: bash
        run: |
          deno test --allow-read --allow-write --allow-run --allow-env \
            tests/integration/isolation_live_test.ts \
            tests/infrastructure/sandbox_*_live_test.ts 2>&1 | tee sandbox.log
          # Only seatbelt may skip on Linux; any other skip means the setup above did not hold.
          skipped=$(grep -F '(skipped: needs' sandbox.log | grep -v seatbelt || true)
          if [ -n "$skipped" ]; then
            echo "::error::a Linux live sandbox test skipped on a host set up for it"
            echo "$skipped"
            exit 1
          fi
          # And each backend's path must have produced a pass, not merely an absence of skips.
          for want in 'isolation live: on container' 'isolation live: on bwrap' \
            'caps live: on container' 'caps live: on bwrap' 'bwrap live: in a user scope'; do
            grep -F "$want" sandbox.log | grep -q ' ok (' ||
              { echo "::error::no passing test for: $want"; exit 1; }
          done

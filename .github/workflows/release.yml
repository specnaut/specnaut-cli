name: release

on:
  push:
    tags:
      - "v*"

# No top-level permissions — each job declares its own minimal block.
# `security-preflight` is read-only on three security endpoints; `build`
# keeps `contents: write` for the actual release publish + tap bump.

jobs:
  # Hybrid security gate (#188's sibling): checks GitHub-side alert state
  # before we let the release build proceed. Critical alerts block the
  # release; high/medium surface as a workflow summary the local /release
  # session reads during postflight (step 10 of the release skill), then dispatches the
  # security-expert agent for triage. Low alerts are logged silently.
  #
  # The release tag is already pushed at this point; failing here is the
  # safest possible failure mode — no GitHub Release object is created,
  # so users on the previous version stay on the previous version (no
  # broken binary reaches them via `specnaut self-update` or the install
  # script). Re-run the workflow after dismissing the alert; the same tag
  # rebuilds cleanly because the commit is unchanged.
  security-preflight:
    runs-on: ubuntu-latest
    permissions:
      security-events: read # the ONLY one that buys anything: code-scanning alerts
      contents: read
    # WHAT THIS JOB CAN ACTUALLY SEE, measured on the v3.2.0 run once #522 made
    # the degraded warning printable for the first time:
    #
    #   code scanning        ✓ readable via `security-events: read`
    #   secret scanning      ✗ needs repo-admin / security-manager rights
    #   dependabot alerts    ✗ GITHUB_TOKEN cannot read them, at any severity
    #   private advisories   ✗ `repository-advisories` is a fine-grained PAT
    #                          scope, not a workflow permissions key — adding it
    #                          here fails the workflow parse outright
    #
    # Three of the four are structural, not a missing line in this block. The
    # comment here used to attribute secret scanning to `security-events` and
    # dependabot to `contents`; both were wrong, and nothing contradicted them
    # because the warning that would have was dead code.
    #
    # The step no longer reports an unreadable source as `0`. A count it could
    # not obtain is `unreadable`, is excluded from the gate decision, and is
    # named in the summary — so a release that passes says which signals it
    # actually checked. Wire a PAT and override GH_TOKEN for this step if the
    # other three must gate releases (see #527).
    steps:
      - name: Query open security alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # `gh api` writes 4xx error JSON to STDOUT (not stderr), so a naive
          # `2>/dev/null || echo 0` lets non-numeric blobs leak into shell
          # arithmetic and crashes the job (line "$((dep_critical + ...))"
          # fails with "syntax error: operand expected"). Wrap every count
          # through a coercer that rejects anything that isn't pure digits.
          # Permission gaps surface as 0 here and downstream — a degraded
          # but non-blocking signal — and a workflow ::warning is emitted
          # so the local /release session can investigate.
          #
          # The degraded labels go to a FILE, not an array (#522). Every call
          # site below is a command substitution, so `fetch_count` runs in a
          # subshell and any `missing_perms+=()` died with it: the parent's
          # array was always empty and the warning at the bottom of this step
          # had never once printed. Not a latent path either — the
          # `private_advisories` query returns non-numeric on every run (see
          # its comment below), so the step has been in degraded mode
          # permanently and silently. A revoked scope on any of the seven
          # queries reads as "0 open alerts", and the gate then passes on an
          # empty signal it believes is a clean one.
          degraded_file="${RUNNER_TEMP:-/tmp}/security-preflight-degraded.txt"
          : > "$degraded_file"
          fetch_count() {
            local label="$1" url="$2" jq_filter="$3"
            local out
            out=$(gh api "$url" --jq "$jq_filter" 2>/dev/null || true)
            if [[ "$out" =~ ^[0-9]+$ ]]; then
              printf '%s' "$out"
            else
              # Appending from a subshell is fine; the parent reads the file.
              printf '%s\n' "$label" >> "$degraded_file"
              printf '0'
            fi
          }

          # 1. Secret scanning — pattern-based credential leak detection
          secret_open=$(fetch_count "secret_scanning" \
            "repos/$REPO/secret-scanning/alerts?state=open&per_page=100" \
            '[.[] | {number, secret_type_display_name, html_url}] | length')

          # 2. Dependabot — vulnerable dependencies (severity-aware)
          dep_critical=$(fetch_count "dependabot/critical" \
            "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            '[.[] | select(.security_advisory.severity=="critical")] | length')
          dep_high=$(fetch_count "dependabot/high" \
            "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            '[.[] | select(.security_advisory.severity=="high")] | length')
          dep_medium=$(fetch_count "dependabot/medium" \
            "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            '[.[] | select(.security_advisory.severity=="medium")] | length')

          # 3. Private vulnerability reports — externally-submitted advisories.
          # `repository-advisories` is a fine-grained PAT scope, NOT a workflow
          # permissions key, so this returns 0 with GITHUB_TOKEN. Wire a
          # dedicated PAT secret if pending advisories must hard-gate releases.
          adv_pending=$(fetch_count "private_advisories" \
            "repos/$REPO/security-advisories?state=triage,draft&per_page=100" \
            '[.[] | {number, summary, severity, html_url}] | length')

          # 4. Code scanning (CodeQL — only counts when code scanning is enabled).
          code_critical=$(fetch_count "code_scanning/critical" \
            "repos/$REPO/code-scanning/alerts?state=open&per_page=100" \
            '[.[] | select(.rule.security_severity_level=="critical")] | length')
          code_high=$(fetch_count "code_scanning/high" \
            "repos/$REPO/code-scanning/alerts?state=open&per_page=100" \
            '[.[] | select(.rule.security_severity_level=="high")] | length')

          # Decision tree:
          #   ANY critical (dep or code) → fail the release.
          #   Secret-scanning open       → fail (every match is treated as P0
          #                                regardless of "severity" — credentials
          #                                in source are always release-blocking).
          #   Pending advisory in triage → fail (a researcher is waiting; ship
          #                                a release without acknowledging is bad
          #                                form).
          critical_total=$((dep_critical + code_critical))

          # Report what was READ, not what was assumed. A source `fetch_count`
          # could not reach yields 0, and 0 is indistinguishable from "clean" —
          # which is how this gate passed every release on three sources it had
          # never once obtained (#527). `unreadable` is the honest cell.
          readable() { ! grep -qxF "$1" "$degraded_file"; }
          cell() { if readable "$1"; then printf '%s' "$2"; else printf 'unreadable'; fi; }

          {
            echo "## Security alert preflight"
            echo
            echo "| Source | Open count |"
            echo "| --- | --- |"
            echo "| Secret scanning | $(cell secret_scanning "$secret_open") |"
            echo "| Dependabot — critical | $(cell dependabot/critical "$dep_critical") |"
            echo "| Dependabot — high | $(cell dependabot/high "$dep_high") |"
            echo "| Dependabot — medium | $(cell dependabot/medium "$dep_medium") |"
            echo "| Code scanning — critical | $(cell code_scanning/critical "$code_critical") |"
            echo "| Code scanning — high | $(cell code_scanning/high "$code_high") |"
            echo "| Pending private advisories | $(cell private_advisories "$adv_pending") |"
            echo
            echo "Critical total (dep + code, readable sources only): **${critical_total}**"
            if [ -s "$degraded_file" ]; then
              echo
              echo "> Sources marked \`unreadable\` were NOT checked. This preflight"
              echo "> passing means the readable ones are clean — nothing more."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Said BEFORE the decision, not after. The read-back used to sit below
          # the hard-fail `exit 1`, so the single run where it matters most —
          # the gate blocking on partial information — was the one run that
          # never printed it (#527).
          #
          # Sorted and de-duplicated: the three dependabot queries share a URL,
          # so one permission gap would otherwise name it three times.
          if [ -s "$degraded_file" ]; then
            missing_perms="$(sort -u "$degraded_file" | tr '\n' ' ' | sed 's/ $//')"
            echo "::warning::Security preflight could not read: ${missing_perms}. Those sources are NOT checked and are excluded from the decision below — a pass here means the readable sources are clean, not that the repository is. Wire a PAT and override GH_TOKEN for this step if they must gate releases (#527)."
          fi

          if [ "$critical_total" -gt 0 ] || [ "$secret_open" -gt 0 ] || [ "$adv_pending" -gt 0 ]; then
            echo "::error::Security preflight blocked the release. Critical/secret/advisory counts are non-zero. Resolve via the Security tab, then re-run this workflow (the tag stays valid)."
            exit 1
          fi

          if [ "$dep_high" -gt 0 ] || [ "$code_high" -gt 0 ]; then
            echo "::warning::High-severity findings open: $dep_high dependabot + $code_high code-scanning. The release proceeds; dispatch the security-expert agent locally to triage."
          fi

  # The tag is what publishes, and nothing here used to ask whether the commit
  # it points at is green.
  #
  # `ci.yml` runs the suite on three OSes on every push to `main`; this workflow
  # runs none of it. So a tag pushed over a red `main` compiled, checksummed and
  # published a Release, entirely green, with a known-failing commit inside it.
  # The only thing standing in the way was `.specnaut/release/preflight.sh` — a
  # script an operator runs locally and can skip, and which cannot be consulted
  # from here. Observed on the v4.2.2 attempt: `main` was red on Windows and the
  # tag pipeline would not have noticed.
  #
  # `ci` on this SHA starts at the same moment as this workflow — the release
  # commit is pushed to `main` immediately before the tag — so the job WAITS
  # rather than reading a conclusion that does not exist yet. What it does with
  # each outcome is the whole design:
  #
  #   concluded failure/cancelled/timed_out → block. The tag survives a failed
  #     workflow, so the fix is to repair `main` and re-run this run; nothing
  #     needs deleting and re-tagging.
  #   concluded success                     → proceed.
  #   no run for this SHA at all            → warn and proceed. A repository or
  #     ref where `ci` does not run must not be unable to release.
  #   still running after the window        → warn and proceed. Blocking a
  #     release on a stuck runner trades one failure mode for a worse one; the
  #     window is set well past `ci`'s historical duration so this is rare and
  #     worth reading when it happens.
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require ci green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # 25 minutes at 20s. `ci` has historically concluded in 8-11 minutes,
          # the Windows cross-smoke job being the long pole.
          deadline=$(( SECONDS + 25 * 60 ))
          status=""
          conclusion=""

          while :; do
            # `--jq` on an empty result yields an empty string, not an error.
            read -r status conclusion <<< "$(
              gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
                --jq '.workflow_runs[0] | "\(.status) \(.conclusion // "-")"' 2>/dev/null || true
            )"

            [ "$status" = "completed" ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 20
          done

          {
            echo "### CI status on the tagged commit"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${SHA}\` |"
            echo "| ci run status | \`${status:-none}\` |"
            echo "| ci run conclusion | \`${conclusion:--}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$status" ]; then
            echo "::warning::No ci.yml run found for ${SHA}. The release proceeds, but nothing has verified this commit."
            exit 0
          fi

          if [ "$status" != "completed" ]; then
            echo "::warning::ci.yml on ${SHA} was still ${status} after the wait window. The release proceeds unverified — check the run before announcing it."
            exit 0
          fi

          if [ "$conclusion" != "success" ]; then
            echo "::error::ci.yml concluded ${conclusion} on ${SHA}. Refusing to publish a release over a failing commit. Fix main, then re-run this workflow — the tag stays valid."
            exit 1
          fi

          echo "ci.yml is green on ${SHA}"

  build:
    needs: [security-preflight, ci-status]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `scripts/gen-changelog.ts` calls `gh pr view <num> --json body`
      # to extract the `## Agent adoption` section from each feat: PR.
      # Two things are required for those calls to succeed in CI, and both
      # are now in place (#363):
      #   1. `pull-requests: read` below grants the token the scope.
      #   2. `env: GH_TOKEN: ${{ github.token }}` on the "Generate release
      #      notes" step actually places the token in the step env so `gh`
      #      is authenticated — a permission scope alone does NOT do this.
      # Earlier only (1) was applied, so `gh` ran unauthenticated and every
      # adoption fetch failed silently, shipping a body with no
      # `### Adoption guide` block (e.g. v1.6.0 / v1.13.0, amended manually
      # post-release). The step now also runs `--strict`, which fails the
      # build on any retrieval failure rather than publishing a partial guide.
      pull-requests: read
      # Keyless signing (#577). `id-token: write` mints the OIDC token Fulcio
      # exchanges for a short-lived signing certificate; `attestations: write`
      # persists the result. Neither is a stored secret, which is what makes
      # this shape the only one available here — a signing key would have to
      # live as an Actions secret, and this repository holds none by policy
      # (`tests/scripts/no_secrets_in_public_repo_test.ts`).
      #
      # `artifact-metadata: write` is deliberately ABSENT. The action's setup
      # prose lists it, its own provenance example does not, and it is only
      # consumed when pushing a storage record to a registry — which the step
      # below switches off. An invalid permissions key fails the workflow parse
      # outright (see the `repository-advisories` note above), and on a
      # tag-triggered run a parse failure means no release object at all.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so `git describe` and `git log <prev>..HEAD`
          # can produce the changelog.
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Bundle templates
        run: deno task bundle
      - name: Plugin pre-flight (version lockstep + scaffold integrity)
        run: |
          set -euo pipefail
          # 1. plugin.json must be parseable JSON
          jq -e . plugin/.claude-plugin/plugin.json > /dev/null
          # 2. Plugin scaffold must contain at minimum the specnaut router skill
          # (catches an accidentally truncated plugin/ directory).
          test -f plugin/skills/specnaut/SKILL.md
          # 3. Hard fail if plugin.json version drifts from deno.json version.
          # The two are kept in lockstep by scripts/bump-version.ts.
          BIN_VERSION=$(jq -r .version deno.json)
          PLUGIN_VERSION=$(jq -r .version plugin/.claude-plugin/plugin.json)
          if [ "$BIN_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::plugin/.claude-plugin/plugin.json version ($PLUGIN_VERSION) does not match deno.json version ($BIN_VERSION). Re-run scripts/bump-version.ts."
            exit 1
          fi
          # 4. Hard fail if templates/manifest.json version drifts.
          # `TEMPLATES_VERSION` in src/templates_bundle.ts is generated
          # from this file; surfacing a stale value would mislabel the
          # binary's `--version` output.
          MANIFEST_VERSION=$(jq -r .version templates/manifest.json)
          if [ "$BIN_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::templates/manifest.json version ($MANIFEST_VERSION) does not match deno.json version ($BIN_VERSION). Re-run scripts/bump-version.ts."
            exit 1
          fi
          # 5. Hard fail if .codex-plugin/plugin.json version drifts.
          # Codex users install directly from this repository, so the
          # manifest must match the binary it ships beside. The fork this
          # used to name was deleted 2026-08-22 and publishes nothing —
          # the gate is still right, its old reason was not, and a gate
          # defended by a false reason is one somebody deletes.
          CODEX_VERSION=$(jq -r .version .codex-plugin/plugin.json)
          if [ "$BIN_VERSION" != "$CODEX_VERSION" ]; then
            echo "::error::.codex-plugin/plugin.json version ($CODEX_VERSION) does not match deno.json version ($BIN_VERSION). Re-run scripts/bump-version.ts."
            exit 1
          fi
          # 6. Hard fail if .cursor-plugin/plugin.json version drifts.
          # Cursor users install directly from the repo; the manifest's
          # version must match the binary or the install would advertise
          # a stale version.
          CURSOR_VERSION=$(jq -r .version .cursor-plugin/plugin.json)
          if [ "$BIN_VERSION" != "$CURSOR_VERSION" ]; then
            echo "::error::.cursor-plugin/plugin.json version ($CURSOR_VERSION) does not match deno.json version ($BIN_VERSION). Re-run scripts/bump-version.ts."
            exit 1
          fi
          echo "✓ plugin manifests valid, scaffold present, versions $PLUGIN_VERSION/$MANIFEST_VERSION/$CODEX_VERSION/$CURSOR_VERSION match binary"
      - name: Cross-compile all targets
        run: deno run --allow-read --allow-write --allow-run --allow-env scripts/build.ts
      - name: Attest build provenance
        id: attest
        uses: actions/attest@v4
        with:
          # Enumerated by the pipeline, not by a list. This step runs BEFORE
          # checksums are computed, so `dist/` holds exactly the binaries
          # `scripts/build.ts` produced and nothing else — the glob cannot fall
          # behind the target list the way the `files:` block below can.
          subject-path: dist/specnaut-*
          # No registry push, so no storage record — and therefore no need for
          # the permission key the comment above declines to add.
          create-storage-record: false
      - name: Compute checksums
        run: |
          cd dist
          for f in specnaut-*; do
            shasum -a 256 "$f" > "$f.sha256"
          done
      - name: Stage the attestation bundle for upload
        # AFTER the checksum loop, and named with a dot rather than a hyphen,
        # for the same reason twice: `for f in specnaut-*` would otherwise match
        # the bundle, emit a `.sha256` for it, and quietly add a twelfth asset
        # to a release the gates expect to hold eleven.
        #
        # `bundle-path` is absolute and outside the workspace, so it is copied
        # in rather than referenced from `files:` directly. One bundle covers
        # every subject — the in-toto statement lists all five binaries.
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/specnaut.attestation.sigstore.json
      - name: Generate release notes
        env:
          # Authenticate `gh pr view` so each feat PR's `## Agent adoption`
          # block is retrievable in CI — the root-cause fix for #363. Without
          # this the token's `pull-requests: read` scope is never placed in the
          # step env, so `gh` runs unauthenticated and every fetch fails.
          GH_TOKEN: ${{ github.token }}
        # `--strict` fails the build on any PR-body retrieval failure, before
        # the "Create release" step publishes — so an incomplete Adoption guide
        # can never ship silently. `--allow-env` is added for explicitness
        # (the token reaches `gh` via subprocess env inheritance regardless).
        # `--highlights` is passed only when the file exists, so a release
        # without a hand-written lead still produces byte-identical notes. A
        # named-but-unreadable file is a hard error inside the script — the
        # one section a human authored must never go missing quietly.
        run: |
          if [ -s .specnaut/release/HIGHLIGHTS.md ]; then
            deno run --allow-read --allow-write --allow-run --allow-env \
              scripts/gen-changelog.ts --strict \
              --highlights .specnaut/release/HIGHLIGHTS.md
          else
            deno run --allow-read --allow-write --allow-run --allow-env \
              scripts/gen-changelog.ts --strict
          fi
      - name: Create release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/specnaut-macos-x64
            dist/specnaut-macos-x64.sha256
            dist/specnaut-macos-arm64
            dist/specnaut-macos-arm64.sha256
            dist/specnaut-linux-x64
            dist/specnaut-linux-x64.sha256
            dist/specnaut-linux-arm64
            dist/specnaut-linux-arm64.sha256
            dist/specnaut-windows-x64.exe
            dist/specnaut-windows-x64.exe.sha256
            dist/specnaut.attestation.sigstore.json
          body_path: dist/release-notes.md
          # Without this the action defaults to false: nine of the ten files
          # present means it uploads nine, creates the release, and reports
          # success. A tag and its release are effectively immutable, so the
          # only recovery is another patch — and until it ships, every user on
          # the missing platform gets a 404 from `install.sh` and `self-update`,
          # both of which resolve assets by tag. Fail before publishing instead
          # (#521). `postflight.sh` still asserts `asset_count >= 10` as the
          # second net; this is the gate upstream of it.
          fail_on_unmatched_files: true
          # Both packaging channels resolve exclusively through
          # `releases/latest`. Whether a new release becomes latest is an
          # upstream default here, unpinned — and a release that is not latest
          # makes both syncs read the PREVIOUS version, report "nothing to do"
          # and exit green having published nothing. Pinned, so the thing two
          # distribution channels depend on is stated rather than inherited.
          make_latest: true
      # NOTHING IS PUSHED FROM HERE ANY MORE.
      #
      # Two steps used to live at this point: a Homebrew tap bump and a
      # marketplace catalog bump, each reading a fine-grained PAT held as a
      # secret on THIS repository — which is public. A repository publishing a
      # release should not need write access to everything that packages or
      # lists it, and the credentials enabling that should not sit in a public
      # repo at all.
      #
      # The direction is inverted. `specnaut/homebrew-tap` and
      # `specnaut/specnaut-marketplace` each run their own `sync from
      # specnaut-cli` workflow, reading this repository's Releases API — which
      # needs no authentication, because this repository is public — and
      # committing to themselves with their own run-scoped GITHUB_TOKEN. Zero
      # secrets, in either direction.
      #
      # `HOMEBREW_TAP_TOKEN`, `MARKETPLACE_SYNC_TOKEN` and `CODEX_SYNC_TOKEN`
      # were deleted from this repository's secrets on 2026-08-22. Do not
      # re-provision any of them.
      #
      # Latency is the trade: each target syncs on its own cron rather than
      # within seconds of the tag. `.specnaut/release/postflight.sh` dispatches
      # both immediately after a release using the operator's own credentials,
      # so a normal release still publishes at once — and it verifies the
      # published artefacts rather than trusting an exit code.

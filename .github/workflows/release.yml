name: release

on:
  push:
    tags:
      - "v*"

# No top-level permissions — each job declares its own minimal block. Only
# `build` can write (the release itself); only `sign-macos` can reach the
# macOS signing identity, and it runs no repository code.

env:
  # The macOS signing identity (cli#428): sign-macos, macos-smoke, build.
  MACOS_TEAM_ID: H87Y8Z6YPS
  MACOS_IDENTIFIER: com.specnaut.cli
  # rcodesign, pinned by version and sha256 (release_downloads_pinned_test.ts).
  RCODESIGN_URL: https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz
  RCODESIGN_SHA256: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002

jobs:
  # Hybrid security gate (#188's sibling): checks GitHub-side alert state
  # before we let the release build proceed. Critical alerts block the
  # release; high/medium surface as a workflow summary, triaged in the
  # Security tab. Low alerts are logged silently.
  #
  # The release tag is already pushed at this point; failing here is the
  # safest possible failure mode — no GitHub Release object is created,
  # so users on the previous version stay on the previous version (no
  # broken binary reaches them via `specnaut self-update` or the install
  # script). Re-run the workflow after dismissing the alert; the same tag
  # rebuilds cleanly because the commit is unchanged.
  security-preflight:
    runs-on: ubuntu-latest
    permissions:
      security-events: read # the ONLY one that buys anything: code-scanning alerts
      contents: read
    # What this job's token can and cannot read, and why three sources are
    # gated locally instead (#653), is written at the top of the script.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Query open security alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash scripts/release/security-preflight.sh

  # The tag is what publishes: this waits for `ci` on the tagged commit and
  # blocks on a red one or one still running past the wait. The outcomes are written
  # at the top of the script.
  ci-status:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Require ci green on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: bash scripts/release/require-ci-green.sh

  # Builds every binary. It runs the tagged commit's code, so it holds no
  # credential and cannot write; the signing identity never reaches it.
  compile:
    needs: [security-preflight, ci-status]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.all }}
      macos: ${{ steps.targets.outputs.macos }}
    steps:
      # Every action in this file is pinned to a commit SHA, with the version
      # it corresponds to in a trailing comment. The attest step says why;
      # tests/scripts/release_actions_pinned_test.ts fails on a floating ref.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Bundle templates
        run: deno task bundle
      - name: Plugin pre-flight (version lockstep + scaffold integrity)
        run: bash scripts/release/plugin-preflight.sh
      - name: The release target table (scripts/build.ts TARGETS)
        id: targets
        # The jobs below read the asset names from here, never from a list.
        run: |
          set -euo pipefail
          all="$(deno run scripts/build.ts --list-json)"
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "macos=$(jq -c '[.[] | select(.goos == "darwin")]' <<<"$all")" >> "$GITHUB_OUTPUT"
      - name: Cross-compile all targets
        run: deno run --allow-read --allow-write --allow-run --allow-env scripts/build.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled
          # The entitlements travel with the binaries: sign-macos checks
          # nothing out. Neither path matches `dist/specnaut-*` downstream.
          path: |
            dist/specnaut-*
            packaging/macos/entitlements.plist
          if-no-files-found: error
          retention-days: 1

  # Signs and notarizes the macOS binaries with the Developer ID of team
  # H87Y8Z6YPS (cli#428). The key never touches repository code: this job
  # checks nothing out and runs no Deno, and holds only `id-token: write`.
  # The `macos-signing` environment (restricted to `v*` tags) is what the
  # cloud side trusts; infra/Pulumi.yaml creates that side, keyless — this
  # repository still stores no secret.
  #
  # Unconditional, branching inside: in a fork it passes the binaries through
  # unsigned with a warning. Skipping the job would skip `build`, and an
  # `if: always()` there would also drop the security and ci gates. In the
  # canonical repository any failure here fails the release; nothing ships
  # unsigned. tests/scripts/release_signing_layout_test.ts holds this shape.
  sign-macos:
    needs: compile
    runs-on: ubuntu-latest
    environment: macos-signing
    permissions:
      id-token: write
    env:
      # The release-signing scope inside GCP project `specnaut`, created by
      # infra/Pulumi.yaml (its own pool, one provider, one service account).
      GCP_PROJECT: specnaut
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/93906418112/locations/global/workloadIdentityPools/github-release-signing/providers/specnaut-cli-release
      GCP_SERVICE_ACCOUNT: macos-release-signer@specnaut.iam.gserviceaccount.com
      MACOS_JSON: ${{ needs.compile.outputs.macos }}
      # The entitlements arrive in an artifact a job running repository code
      # built; this pin is checked before signing (macos_entitlements_test.ts).
      MACOS_ENTITLEMENTS_SHA256: d3caf7b18ce9d0f5cec8282c4d25866d5829ec636b09a1e248e858bc9d39dbc3
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled
      - name: A fork passes the macOS binaries through unsigned
        if: github.repository_id != '1218483524'
        run: echo "::warning::$GITHUB_REPOSITORY is a fork; the macOS binaries are NOT signed. Only specnaut/specnaut-cli (repository id 1218483524) can reach the signing identity."
      - id: auth
        if: github.repository_id == '1218483524'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
          access_token_lifetime: 300s
      - name: Fetch the signing material into files only this user can read
        if: github.repository_id == '1218483524'
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        # Secret Manager's REST API, no SDK. The bearer header and every value
        # go to 0600 files, never a variable or an argument; each payload is
        # base64-decoded straight into its file. On failure: the HTTP status.
        run: |
          set -euo pipefail
          umask 077
          dir="$RUNNER_TEMP/signing"
          mkdir "$dir"
          printf 'Authorization: Bearer %s\n' "$ACCESS_TOKEN" > "$dir/auth-header"
          api="https://secretmanager.googleapis.com/v1/projects/$GCP_PROJECT/secrets"
          for name in macos-developer-id-p12 macos-developer-id-p12-password app-store-connect-api-key; do
            status="$(curl -sS -o "$dir/response" -w '%{http_code}' -H @"$dir/auth-header" \
              "$api/$name/versions/latest:access" 2>/dev/null)" || status="${status:-unreachable}"
            if [ "$status" != 200 ]; then
              echo "::error::could not read $name from Secret Manager (HTTP $status)"
              exit 1
            fi
            jq -j '.payload.data' "$dir/response" | base64 -d > "$dir/$name"
            rm -f "$dir/response"
          done
          rm -f "$dir/auth-header"
      - name: Install rcodesign (pinned version and sha256)
        if: github.repository_id == '1218483524'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rcodesign" && cd "$RUNNER_TEMP/rcodesign"
          curl -fsSLo rcodesign.tar.gz "$RCODESIGN_URL"
          echo "$RCODESIGN_SHA256  rcodesign.tar.gz" | sha256sum -c -
          tar -xzf rcodesign.tar.gz --strip-components=1
          chmod +x rcodesign
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Sign with the Developer ID, hardened runtime, identifier com.specnaut.cli
        if: github.repository_id == '1218483524'
        run: |
          set -euo pipefail
          echo "$MACOS_ENTITLEMENTS_SHA256  packaging/macos/entitlements.plist" | sha256sum -c -
          for name in $(jq -r '.[].outName' <<<"$MACOS_JSON"); do
            rcodesign sign --for-notarization --code-signature-flags runtime \
              --p12-file "$RUNNER_TEMP/signing/macos-developer-id-p12" \
              --p12-password-file "$RUNNER_TEMP/signing/macos-developer-id-p12-password" \
              --entitlements-xml-file packaging/macos/entitlements.plist \
              --binary-identifier "$MACOS_IDENTIFIER" "dist/$name"
          done
          # Notarization needs only the API key: the key and its password go now.
          rm -f "$RUNNER_TEMP/signing/macos-developer-id-p12" \
            "$RUNNER_TEMP/signing/macos-developer-id-p12-password"
      - name: Notarize (no stapling — a bare Mach-O cannot hold a ticket)
        if: github.repository_id == '1218483524'
        # Apple's notary service refuses a bare Mach-O, so each binary goes up
        # in a throwaway zip; the ticket binds to its cdhash, so it covers the
        # bytes in dist/. A rejection exits non-zero.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/notary"
          for name in $(jq -r '.[].outName' <<<"$MACOS_JSON"); do
            zip -jq "$RUNNER_TEMP/notary/$name.zip" "dist/$name"
            rcodesign notary-submit --wait \
              --api-key-file "$RUNNER_TEMP/signing/app-store-connect-api-key" \
              "$RUNNER_TEMP/notary/$name.zip"
          done
      - name: Delete the signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/specnaut-*
          if-no-files-found: error
          retention-days: 1

  # Runs each signed binary on its own architecture before anything publishes.
  macos-smoke:
    needs: [compile, sign-macos]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compile.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    # Checks out the tag for the shared check script; holds no credential.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Run, verify and assess the signed binary
        env:
          BIN: dist/${{ matrix.outName }}
          CANONICAL: ${{ github.repository_id == '1218483524' }}
        run: |
          set -euo pipefail
          chmod +x "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          "$BIN" --version
          if [ "$CANONICAL" != true ]; then
            echo "::warning::$BIN is unsigned in a fork; Gatekeeper is not assessed."
            exit 0
          fi
          bash scripts/release/check-macos-signature.sh "$MACOS_TEAM_ID" "$MACOS_IDENTIFIER" "$BIN"
          spctl -a -vvv -t install "$BIN"

  build:
    needs: [security-preflight, ci-status, compile, sign-macos, macos-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `scripts/gen-changelog.ts` calls `gh pr view <num> --json body`
      # to extract the `## Agent adoption` section from each feat: PR.
      # Two things are required for those calls to succeed in CI, and both
      # are now in place (#363):
      #   1. `pull-requests: read` below grants the token the scope.
      #   2. `env: GH_TOKEN: ${{ github.token }}` on the "Generate release
      #      notes" step actually places the token in the step env so `gh`
      #      is authenticated — a permission scope alone does NOT do this.
      # Earlier only (1) was applied, so `gh` ran unauthenticated and every
      # adoption fetch failed silently, shipping a body with no
      # `### Adoption guide` block (e.g. v1.6.0 / v1.13.0, amended manually
      # post-release). The step now also runs `--strict`, which fails the
      # build on any retrieval failure rather than publishing a partial guide.
      pull-requests: read
      # Keyless signing (#577). `id-token: write` mints the OIDC token Fulcio
      # exchanges for a short-lived signing certificate; `attestations: write`
      # persists the result. Neither is a stored secret, which is what makes
      # this shape the only one available here — a signing key would have to
      # live as an Actions secret, and this repository holds none by policy
      # (`tests/scripts/no_secrets_in_public_repo_test.ts`).
      #
      # `artifact-metadata: write` is deliberately ABSENT — because it buys
      # nothing here, NOT because it is risky. It is a perfectly valid
      # permissions key: `actions/attest`'s README uses it, and uses it in
      # exactly one place, the container-image example, which is the example
      # that pushes to a registry.
      #
      # That is the whole reason. The permission is consumed only when a storage
      # record is written, the action gates all storage-record work behind
      # `push-to-registry`, and the step below sets `create-storage-record:
      # false` and pushes to no registry. Granting it would widen the token for
      # a code path this workflow never reaches.
      #
      # An earlier version of this comment closed on a parse-failure risk,
      # having already conceded in its previous clause that the action's prose
      # lists the key — it contradicted itself, and the half that was wrong is
      # the half that read as the reason. A correct constraint defended by a
      # checkable false premise is one somebody deletes the moment they check
      # (cli#597). The `repository-advisories` note above makes the
      # parse-failure argument correctly, about a genuinely invalid key.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history + tags so `git describe` and `git log <prev>..HEAD`
          # can produce the changelog.
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: The signed set is exactly the compiled target list
        env:
          TARGETS_JSON: ${{ needs.compile.outputs.targets }}
        run: |
          set -euo pipefail
          find dist -mindepth 1 -maxdepth 1 -exec basename {} \; | sort > "$RUNNER_TEMP/got"
          jq -r '.[].outName' <<<"$TARGETS_JSON" | sort > "$RUNNER_TEMP/want"
          test "$(wc -l < "$RUNNER_TEMP/want")" -gt 1 # an empty table must not equal an empty dir
          diff "$RUNNER_TEMP/want" "$RUNNER_TEMP/got"
      - name: Install rcodesign (pinned version and sha256)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rcodesign" && cd "$RUNNER_TEMP/rcodesign"
          curl -fsSLo rcodesign.tar.gz "$RCODESIGN_URL"
          echo "$RCODESIGN_SHA256  rcodesign.tar.gz" | sha256sum -c -
          tar -xzf rcodesign.tar.gz --strip-components=1
          chmod +x rcodesign
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Refuse an unsigned macOS binary in the canonical repository
        # Before attest: the attestation and the checksums must never bless an
        # unsigned binary. A fork passes through with a warning.
        env:
          MACOS_JSON: ${{ needs.compile.outputs.macos }}
          CANONICAL: ${{ github.repository_id == '1218483524' }}
        run: bash scripts/release/require-macos-signed.sh
      - name: Attest build provenance
        id: attest
        # Pinned to a commit, and this is the pin that must not float. The
        # bundle this action emits is a contract with binaries ALREADY
        # installed: `self-update` accepts exactly one shape — a Sigstore
        # bundle v0.3 whose tlog entry carries a Rekor v1 Signed Entry
        # Timestamp under the pinned Rekor key (`verifiedSigningTime` in
        # `src/domain/sigstore/verify.ts`). If a minor release of the action
        # moved to Rekor v2 or an RFC 3161 timestamp, every installed binary
        # would refuse the next release with `untrusted-timestamp`, and an
        # update it refuses cannot fix it — only a manual reinstall can.
        #
        # So bumping this SHA is a deliberate act: check the new version's
        # bundle against `verifiedSigningTime` before it lands. The price is
        # that fixes, security ones included, no longer arrive on their own.
        # Enforced by tests/scripts/release_actions_pinned_test.ts.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # Enumerated by the pipeline, not by a list. `dist/` is the set
          # sign-macos uploaded, checked above to be exactly the binaries
          # `scripts/build.ts` lists, and this runs BEFORE any checksum exists:
          # the glob covers the signed bytes and nothing else. The notary zips
          # and the entitlements never enter `dist/`, and the glob cannot fall
          # behind the target list the way the `files:` block below can.
          subject-path: dist/specnaut-*
          # No registry push, so no storage record — and therefore no need for
          # the permission key the comment above declines to add.
          create-storage-record: false
      - name: Compute checksums
        run: |
          cd dist
          for f in specnaut-*; do
            shasum -a 256 "$f" > "$f.sha256"
          done
      - name: Stage the attestation bundle for upload
        # AFTER the checksum loop, and named with a dot rather than a hyphen,
        # for the same reason twice: `for f in specnaut-*` would otherwise match
        # the bundle, emit a `.sha256` for it, and quietly add a twelfth asset
        # to a release the gates expect to hold eleven.
        #
        # `bundle-path` is absolute and outside the workspace, so it is copied
        # in rather than referenced from `files:` directly. One bundle covers
        # every subject — the in-toto statement lists all five binaries.
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/specnaut.attestation.sigstore.json
      - name: Generate release notes
        env:
          # Authenticate `gh pr view` so each feat PR's `## Agent adoption`
          # block is retrievable in CI — the root-cause fix for #363. Without
          # this the token's `pull-requests: read` scope is never placed in the
          # step env, so `gh` runs unauthenticated and every fetch fails.
          GH_TOKEN: ${{ github.token }}
        # `--strict` fails the build on any PR-body retrieval failure, before
        # the "Create release" step publishes — so an incomplete Adoption guide
        # can never ship silently. `--allow-env` is added for explicitness
        # (the token reaches `gh` via subprocess env inheritance regardless).
        # `--highlights` is passed only when the file exists, so a release
        # without a hand-written lead still produces byte-identical notes. A
        # named-but-unreadable file is a hard error inside the script — the
        # one section a human authored must never go missing quietly.
        run: |
          if [ -s .specnaut/release/HIGHLIGHTS.md ]; then
            deno run --allow-read --allow-write --allow-run --allow-env \
              scripts/gen-changelog.ts --strict \
              --highlights .specnaut/release/HIGHLIGHTS.md
          else
            deno run --allow-read --allow-write --allow-run --allow-env \
              scripts/gen-changelog.ts --strict
          fi
      - name: Create release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/specnaut-macos-x64
            dist/specnaut-macos-x64.sha256
            dist/specnaut-macos-arm64
            dist/specnaut-macos-arm64.sha256
            dist/specnaut-linux-x64
            dist/specnaut-linux-x64.sha256
            dist/specnaut-linux-arm64
            dist/specnaut-linux-arm64.sha256
            dist/specnaut-windows-x64.exe
            dist/specnaut-windows-x64.exe.sha256
            dist/specnaut.attestation.sigstore.json
          body_path: dist/release-notes.md
          # Without this the action defaults to false: nine of the ten files
          # present means it uploads nine, creates the release, and reports
          # success. A tag and its release are effectively immutable, so the
          # only recovery is another patch — and until it ships, every user on
          # the missing platform gets a 404 from `install.sh` and `self-update`,
          # both of which resolve assets by tag. Fail before publishing instead
          # (#521). `postflight.sh` still asserts `asset_count >= 10` as the
          # second net; this is the gate upstream of it.
          fail_on_unmatched_files: true
          # Both packaging channels resolve exclusively through
          # `releases/latest`. Whether a new release becomes latest is an
          # upstream default here, unpinned — and a release that is not latest
          # makes both syncs read the PREVIOUS version, report "nothing to do"
          # and exit green having published nothing. Pinned, so the thing two
          # distribution channels depend on is stated rather than inherited.
          make_latest: true
      # NOTHING IS PUSHED FROM HERE ANY MORE.
      #
      # Two steps used to live at this point: a Homebrew tap bump and a
      # marketplace catalog bump, each reading a fine-grained PAT held as a
      # secret on THIS repository — which is public. A repository publishing a
      # release should not need write access to everything that packages or
      # lists it, and the credentials enabling that should not sit in a public
      # repo at all.
      #
      # The direction is inverted. `specnaut/homebrew-tap` and
      # `specnaut/specnaut-marketplace` each run their own `sync from
      # specnaut-cli` workflow, reading this repository's Releases API — which
      # needs no authentication, because this repository is public — and
      # committing to themselves with their own run-scoped GITHUB_TOKEN. Zero
      # secrets, in either direction.
      #
      # `HOMEBREW_TAP_TOKEN`, `MARKETPLACE_SYNC_TOKEN` and `CODEX_SYNC_TOKEN`
      # were deleted from this repository's secrets on 2026-08-22. Do not
      # re-provision any of them.
      #
      # Latency is the trade: each target syncs on its own cron rather than
      # within seconds of the tag. `.specnaut/release/postflight.sh` dispatches
      # both immediately after a release using the operator's own credentials,
      # so a normal release still publishes at once — and it verifies the
      # published artefacts rather than trusting an exit code.
